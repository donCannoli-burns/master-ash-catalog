name: bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand prepared ask-wiki project
        shell: bash
        run: |
          cat > /tmp/master-ash-catalog.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 -d /tmp/master-ash-catalog.b64 > /tmp/master-ash-catalog.tar.gz
          tar -xzf /tmp/master-ash-catalog.tar.gz -C .
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Go ask-wiki catalog"
          git push
